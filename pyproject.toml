[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-crypto-trading-bot"
version = "0.1.0"
description = "Local, simulation-only foundation for modular crypto trading research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.scripts]
trading-bot = "app.cli:main"
trading-data = "app.market_data.cli:main"
trading-research = "backtesting.research:main"
trading-diagnose = "backtesting.diagnostics:main"
trading-net-research = "backtesting.net_reward_research:main"
trading-dashboard = "dashboard.server:main"
trading-perpetual-paper = "app.derivatives.forward_paper:main"
trading-perpetual-realtime-paper = "app.derivatives.realtime_paper:main"
trading-kraken-readonly = "app.exchange.kraken_futures_readonly:main"
trading-kraken-instrument = "app.exchange.kraken_futures_instrument:main"
trading-kraken-futures-history = "app.market_data.kraken_futures_history:main"
trading-readiness = "app.readiness:main"
trading-derivative-qualification = "app.derivatives.qualification:main"
trading-adaptive-protocol = "backtesting.adaptive_forward_protocol:main"
trading-adaptive-protocol-v2 = "backtesting.adaptive_forward_protocol_v2:main"
trading-adaptive-research-v2 = "backtesting.adaptive_forward_research_v2:main"
trading-regime-2026-diagnostic = "backtesting.regime_2026_diagnostic:main"
trading-crash-2022-diagnostic = "backtesting.market_crash_2022_diagnostic:main"
trading-kraken-recent-trades = "app.market_data.kraken_futures_trades:main"

[tool.setuptools.packages.find]
include = ["app*", "backtesting*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["static/*.html", "static/*.css", "static/*.js"]

[tool.uv]
package = true
